# Render Blueprint for the InternSetu backend (free plan).
# Database: use Neon (free Postgres). Render's free Postgres is deleted after 30 days.
# Web (Next.js) goes on Vercel; see DEPLOYMENT.md.
services:
  - type: web
    name: internsetu-api
    runtime: python
    plan: free                  # sleeps after ~15 min idle; first request then takes 30-60 s
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migrations run on every start (safe to repeat); the app only starts if they succeed
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION     # adjust if Render rejects it; any supported 3.11-3.13 release works
        value: 3.12.3
      - key: DATABASE_URL       # Neon string, rewritten as postgresql+psycopg2://...?sslmode=require
        sync: false
      - key: SECRET_KEY         # generated by Render (long random value)
        generateValue: true
      - key: CORS_ORIGINS       # your Vercel URL(s), comma separated, no trailing slash
        sync: false
      - key: MATCHING_METHOD    # embeddings (hybrid/semantic) are too heavy for 512 MB RAM
        value: baseline
      - key: WARM_UP            # skip model warm-up at start
        value: "0"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
