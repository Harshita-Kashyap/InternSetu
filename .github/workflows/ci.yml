# Runs on every push and every pull request to main/develop (Week 9 of the course plan).
# A red build means a test or type check failed; fix it before merging.
name: CI
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # coverage is measured on application code (see backend/.coveragerc); the build fails below 80%
      - run: pytest -q -n auto --cov=app --cov-config=.coveragerc --cov-report=term --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.xml }
  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage   # thresholds are set in vitest.config.ts
      - run: npx next build
  mobile:
    name: Mobile (types, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx jest --coverage --coverageReporters=text-summary --coverageReporters=lcov   # thresholds are set in package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mobile-coverage, path: mobile/coverage/lcov.info }
