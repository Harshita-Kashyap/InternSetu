# docker compose up --build   -> API on :8000 (put a TLS reverse proxy such as Caddy/nginx in front for HTTPS)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: internsetu, POSTGRES_PASSWORD: change-me, POSTGRES_DB: internsetu }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U internsetu"], interval: 5s, retries: 10 }
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://internsetu:change-me@db:5432/internsetu
      SECRET_KEY: replace-with-a-long-random-string-of-32-plus-chars
      CORS_ORIGINS: http://localhost:3000
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    volumes: ["./data:/srv/data"]
  caddy:   # automatic HTTPS: set your domain in Caddyfile
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile"]
    depends_on: [api]
volumes: { pgdata: {} }
